name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPSFLEET_GOLDEN_STRICT: "1"  # D-114: a bad golden seed fails the build
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Python 3.12
        run: uv python install 3.12
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Offline tests (live tests are deselected)
        run: uv run pytest -q
      - name: Offline eval fixtures (gates)
        run: uv run python evals/run.py --offline --yes --cases-dir evals/cases/_fixtures
      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --no-hashes --format requirements-txt > requirements.txt
          git diff --exit-code requirements.txt
