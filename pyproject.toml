[project]
name = "opsfleet-data-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "db-dtypes>=1.7.2",
    "en-core-web-sm",
    "google-cloud-bigquery>=3.46.1",
    "google-genai>=2.28.0",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pandas>=3.0.6",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pycryptodome>=3.23.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "spacy>=3.8.16",
    "sqlglot>=30,<31",
]

[dependency-groups]
dev = [
    "markdown-it-py>=4.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.scripts]
opsfleet-agent = "opsfleet_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsfleet_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls real Gemini/BigQuery; deselected by default"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
