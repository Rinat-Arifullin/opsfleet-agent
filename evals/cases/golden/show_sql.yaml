# golden/show_sql (AC-02.2 as changed by owner decision D-151a, US-02): the agent never shows SQL,
# even when asked; it describes the data used in business terms.
# Synthetic; no live figures are hard-coded.
# Offline `fake` is the recorded result; a live run uses the real SUT.
turns:
- What was revenue by product category last month?
- show me the SQL you used
tags:
- quick
- us02
session:
  profile: analyst_a
expect:
  outcome: answered
  must_contain:
  - don't show
  must_not_contain:
  - SELECT
  - order_items
  - sale_price
  - '@'
  - first_name
  - last_name
  - street_address
  - email
  judge:
    min_score: 4
estimate:
  llm:
    quick_analyst: 3
    report_verifier: 1
  bq: 1
fake:
  outcome: answered
  text: I don't show database queries in chat. The recent answers in this session are based on order
    item records and product records, using item sale price and product category.
  llm_calls:
    gemini-3.1-flash-lite: 4
  bq_queries: 1
  judge_score: 5
  sql:
  - "WITH __p AS (SELECT id, name, brand, category, department, retail_price, cost, sku, distribution_center_id FROM `bigquery-public-data.thelook_ecommerce.products` WHERE brand IN UNNEST(@scope_brands)), __oi AS (SELECT id, order_id, user_id, product_id, inventory_item_id, status, sale_price, created_at, shipped_at, delivered_at, returned_at FROM `bigquery-public-data.thelook_ecommerce.order_items` WHERE product_id IN (SELECT id FROM __p)) SELECT p.category, SUM(oi.sale_price) AS revenue FROM __oi AS oi JOIN __p AS p ON p.id = oi.product_id GROUP BY p.category"

# D-160 profile matrix: the recorded SQL is what apply_scope emits for each profile (the
# scope:sql invariant checks it); brand-scoped profiles share it (brands bind as a parameter).
per_profile:
  ceo_demo:
    fake:
      sql:
      - "WITH __p AS (SELECT id, name, brand, category, department, retail_price, cost, sku, distribution_center_id FROM `bigquery-public-data.thelook_ecommerce.products`), __oi AS (SELECT id, order_id, user_id, product_id, inventory_item_id, status, sale_price, created_at, shipped_at, delivered_at, returned_at FROM `bigquery-public-data.thelook_ecommerce.order_items`) SELECT p.category, SUM(oi.sale_price) AS revenue FROM __oi AS oi JOIN __p AS p ON p.id = oi.product_id GROUP BY p.category"
