# golden/new_vs_returning_customers (AC-05.1, US-05). Synthetic; no live figures are hard-coded.
# Offline `fake` is the recorded result; a live run uses the real SUT.
input: How much of our revenue comes from new customers versus returning ones, and how has that changed
  this year?
tags:
- deep
- us05
- set2
session:
  profile: analyst_a
expect:
  outcome: answered
  must_contain:
  - new
  - returning
  - Calvin Klein
  must_not_contain:
  - '@'
  - first_name
  - last_name
  - street_address
  - email
  max_llm_calls: 10
  judge:
    min_score: 4
fake:
  outcome: answered
  text: Revenue for Calvin Klein split into new customers (first order in the month) and returning customers,
    by month this year. Returning customers hold a growing share. Causes beyond the data are hypotheses.
  llm_calls:
    gemini-3.8-flash: 4
    gemini-3.1-flash-lite: 2
  bq_queries: 2
  judge_score: 5
  sql:
  - SELECT 1 /* recorded placeholder */

# D-160 profile matrix: the scope named in the answer follows the profile.
per_profile:
  analyst_b:
    fake:
      text: Revenue for Carhartt and Levi's split into new customers (first order in the month) and returning
        customers, by month this year. Returning customers hold a growing share. Causes beyond the data
        are hypotheses.
    expect:
      must_contain: [new, returning, Carhartt, Levi's]
  ceo_demo:
    fake:
      text: Revenue for all products split into new customers (first order in the month) and returning
        customers, by month this year. Returning customers hold a growing share. Causes beyond the data
        are hypotheses.
    expect:
      must_contain: [new, returning, all products]
