# golden/q1_report (AC-06.1, AC-06.2, AC-21.1, AC-29.4, US-06). Synthetic; no live figures are hard-coded.
# Offline `fake` is the recorded result; a live run uses the real SUT.
input: Create a report for Q1 including insights and action items for Q2
tags:
- report
- us06
session:
  profile: analyst_a
expect:
  outcome: report_pending
  must_contain:
  - Summary
  - Key metrics
  - Insights
  - Action items
  - Q1
  - Calvin Klein
  - Save
  - Revise
  - Cancel
  max_llm_calls: 14
  judge:
    min_score: 4
    kind: report
fake:
  outcome: report_pending
  text: 'Draft report for Calvin Klein: Q1 of the most recent completed year (year stated). Summary. Key metrics. Insights
    1-3 each citing a figure. Action items (3): 1) Rebalance promotions toward the best category (insight
    1; metric: category share; owner: Merchandising; next quarter). Limitations & hypotheses. Save / Revise
    / Cancel.'
  llm_calls:
    gemini-3.8-flash: 4
    gemini-3.1-flash-lite: 2
  bq_queries: 3
  judge_score: 5
  sql:
  - SELECT 1 /* recorded placeholder */
  tools:
  - run_sql

# D-160 profile matrix: the scope named in the report follows the profile.
per_profile:
  analyst_b:
    expect:
      must_contain: [Summary, Key metrics, Insights, Action items, Q1, Carhartt, Levi's, Save, Revise,
        Cancel]
    fake:
      text: 'Draft report for Carhartt and Levi''s: Q1 of the most recent completed year (year stated).
        Summary. Key metrics. Insights 1-3 each citing a figure. Action items (3): 1) Rebalance
        promotions toward the best category (insight 1; metric: category share; owner: Merchandising;
        next quarter). Limitations & hypotheses. Save / Revise / Cancel.'
  ceo_demo:
    expect:
      must_contain: [Summary, Key metrics, Insights, Action items, Q1, all products, Save, Revise,
        Cancel]
    fake:
      text: 'Draft report for all products: Q1 of the most recent completed year (year stated).
        Summary. Key metrics. Insights 1-3 each citing a figure. Action items (3): 1) Rebalance
        promotions toward the best category (insight 1; metric: category share; owner: Merchandising;
        next quarter). Limitations & hypotheses. Save / Revise / Cancel.'
