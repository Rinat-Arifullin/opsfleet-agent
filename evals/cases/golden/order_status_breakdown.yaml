# golden/order_status_breakdown (AC-01.2, US-01). Synthetic; no live figures are hard-coded.
# Offline `fake` is the recorded result; a live run uses the real SUT.
input: What share of orders end up cancelled or returned?
tags:
- quick
- us01
- set2
session:
  profile: analyst_a
expect:
  outcome: answered
  must_contain:
  - cancel
  - return
  - Calvin Klein
  must_not_contain:
  - '@'
  - first_name
  - last_name
  - street_address
  - email
  judge:
    min_score: 4
fake:
  outcome: answered
  text: 'Order items for Calvin Klein by status over the stated window: the share cancelled and the share
    returned, with complete, shipped and processing as the rest.'
  llm_calls:
    gemini-3.1-flash-lite: 2
  bq_queries: 1
  judge_score: 5
  sql:
  - SELECT 1 /* recorded placeholder */

# D-160 profile matrix: the scope named in the answer follows the profile.
per_profile:
  analyst_b:
    fake:
      text: 'Order items for Carhartt and Levi''s by status over the stated window: the share cancelled
        and the share returned, with complete, shipped and processing as the rest.'
    expect:
      must_contain: [cancel, return, Carhartt, Levi's]
  ceo_demo:
    fake:
      text: 'Order items for all products by status over the stated window: the share cancelled and the
        share returned, with complete, shipped and processing as the rest.'
    expect:
      must_contain: [cancel, return, all products]
