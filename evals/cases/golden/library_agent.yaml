# golden/library_agent (iteration 46; AC-21.10, HLD §4.2 library_agent). Synthetic; no live
# figures are hard-coded. Offline `fake` is the recorded result; a live run uses the real SUT.
# A natural-language library turn: the router labels it `library`, the library agent answers
# with list/search tools only (no SQL tool is bound), and only the user's own reports appear.
input: which of my saved reports are about returns?
tags:
- library
- iter46
session:
  profile: analyst_a
  saved_reports:
  - id: R-DEMO-0201
    title: Returns review
    owner: analyst_a
    tags:
    - returns
  - id: R-DEMO-0202
    title: Holiday sales
    owner: analyst_a
    tags:
    - sales
  - id: R-DEMO-0290
    title: Supplier returns audit
    owner: analyst_b
    tags:
    - returns
# Live ids are store-assigned, so the checks use titles, not R-DEMO ids.
expect:
  outcome: answered
  no_sql: true
  must_contain:
  - Returns review
  must_not_contain:
  - Holiday sales
  - Supplier returns audit
estimate:
  llm:
    router: 1
    library_agent: 2
  bq: 0
fake:
  outcome: answered
  text: 'One saved report is about returns: Returns review.'
  llm_calls:
    gemini-3.1-flash-lite: 3
  bq_queries: 0

# D-160 profile matrix: opted out of the default (all profiles).
profiles: [analyst_a]
profiles_reason: the session's saved-report fixtures are owned by analyst_a; another profile would test report ownership, not this behaviour
