# golden/margin_by_department (AC-01.2, US-01). Synthetic; no live figures are hard-coded.
# Offline `fake` is the recorded result; a live run uses the real SUT.
input: What is our gross margin by department, men vs women?
tags:
- quick
- us01
- set2
session:
  profile: analyst_a
expect:
  outcome: answered
  must_contain:
  - - margin
    - profit
  - - men
    - women
  - Calvin Klein
  must_not_contain:
  - '@'
  - first_name
  - last_name
  - street_address
  - email
  judge:
    min_score: 4
fake:
  outcome: answered
  text: Gross margin (sale price minus product cost) for Calvin Klein, Men vs Women, over the stated window.
    Cancelled and returned items are excluded.
  llm_calls:
    gemini-3.1-flash-lite: 2
  bq_queries: 1
  judge_score: 5
  sql:
  - SELECT 1 /* recorded placeholder */

# D-160 profile matrix: the scope named in the answer follows the profile.
per_profile:
  analyst_b:
    fake:
      text: Gross margin (sale price minus product cost) for Carhartt and Levi's, Men vs Women, over the
        stated window. Cancelled and returned items are excluded.
    expect:
      must_contain: [&id001 [margin, profit], &id002 [men, women], Carhartt, Levi's]
  ceo_demo:
    fake:
      text: Gross margin (sale price minus product cost) for all products, Men vs Women, over the stated
        window. Cancelled and returned items are excluded.
    expect:
      must_contain: [*id001, *id002, all products]
