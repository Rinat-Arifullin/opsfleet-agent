# golden/report_search (AC-21.10). Synthetic; no live figures are hard-coded.
# Offline `fake` is the recorded result; a live run uses the real SUT.
# Code-side search, no judge: the checks are deterministic.
input: find my reports about returns from last quarter
tags:
- light
- library
session:
  profile: analyst_a
  saved_reports:
  - id: R-DEMO-0101
    title: Returns review
    owner: analyst_a
    created: relative:-30d
    tags:
    - returns
  - id: R-DEMO-0102
    title: Holiday sales
    owner: analyst_a
    created: relative:-30d
    tags:
    - sales
  - id: R-DEMO-0900
    title: Returns review (other user)
    owner: analyst_b
    created: relative:-30d
    tags:
    - returns
# Live seeding (evals/live_seed.py) stores the reports, but the library search is reached only
# through /search, not a graph turn, and a seed cannot backdate `created`
# (docs/process/iter-live1-seed-ods.md OD-4, OD-5).
live:
  skip: report search is a slash command the live graph does not route to, and seeded reports cannot be backdated
expect:
  outcome: answered
  no_sql: true
  must_contain:
  - R-DEMO-0101
  must_not_contain:
  - R-DEMO-0102
  - R-DEMO-0900
estimate:
  llm:
    router: 1
    library_agent: 1
  bq: 0
fake:
  outcome: answered
  text: '1 match: R-DEMO-0101, Returns review, created last quarter, tag returns.'
  llm_calls:
    gemini-3.1-flash-lite: 2
  bq_queries: 0

# D-160 profile matrix: opted out of the default (all profiles).
profiles: [analyst_a]
profiles_reason: the session's saved-report fixtures are owned by analyst_a; another profile would test report ownership, not this behaviour
